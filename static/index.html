<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宽带新装受理平台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo">光纤新装受理<span class="dot">●</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="map" class="active">资源地图</button>
    <button data-tab="schedule">安装排程</button>
    <button data-tab="survey">现场勘线</button>
    <button data-tab="device">设备绑定</button>
    <button data-tab="speed">测速与签收</button>
    <button data-tab="customer">用户端</button>
  </nav>
  <div class="role-switch">
    <span>当前角色</span>
    <select id="role">
      <option value="clerk">受理员</option>
      <option value="engineer">工程师</option>
      <option value="customer">用户</option>
    </select>
  </div>
</header>
<main id="main"></main>
<div id="toast-root"></div>
<div id="dialog-root"></div>
<script src="app.js"></script>
</body>
</html>
